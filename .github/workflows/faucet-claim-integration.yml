name: Faucet claim integration

on:
  pull_request:
    paths:
      - 'lib/**'
      - 'gateway/**'
      - 'test/**'
      - 'scripts/**'
      - 'package.json'
      - '.github/workflows/faucet-claim-integration.yml'
  push:
    branches:
      - feature/recoverable-claims
    paths:
      - 'lib/**'
      - 'gateway/**'
      - 'test/**'
      - 'scripts/**'
      - 'package.json'
      - '.github/workflows/faucet-claim-integration.yml'

permissions:
  contents: read

jobs:
  claim-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Check syntax
        run: |
          node --check lib/submit-claim-to-gateway.cjs
          node --check test/submit-claim-to-gateway.test.cjs
          node --check server.js
          node --check gateway/server-v2.mjs
          node --check gateway/claim-routes-v2.cjs
          node --check test/gateway-claim-policy.test.cjs
      - name: Run all offline regression tests (no wallets or credentials)
        run: npm run test:all
