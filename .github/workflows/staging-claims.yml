name: Staging gateway claim tests
on:
  push:
    branches: [gateway-integration-staging]
  pull_request:
    branches: [main]
jobs:
  claim-tests:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --ignore-scripts --no-audit --no-fund
      - run: npm test
