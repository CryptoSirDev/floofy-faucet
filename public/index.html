    <!-- Scripts da Faucet -->
    <script>
        async function loadBalance() {
            try {
                const res = await fetch('/api/balance');
                const data = await res.json();
                if (data.success) {
                    document.getElementById('faucet-balance').innerText = `Faucet Balance: ${Number(data.balance).toLocaleString()} FLOOF`;
                } else {
                    document.getElementById('faucet-balance').innerText = 'Faucet Balance: Offline';
                }
            } catch (e) {
                document.getElementById('faucet-balance').innerText = 'Faucet Balance: Offline';
            }
        }

        loadBalance();

        async function submitClaim() {
            const addressInput = document.getElementById('address');
            const btn = document.getElementById('claim-btn');
            const msg = document.getElementById('msg');
            
            const address = addressInput.value.trim();
            if (!address) {
                msg.style.color = 'red';
                msg.innerText = 'Please enter a valid address.';
                return;
            }

            btn.disabled = true;
            msg.style.color = '#333';
            msg.innerText = 'Processing request...';

            try {
                const response = await fetch('/api/request', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ address })
                });
                const data = await response.json();
                
                msg.style.color = data.success ? 'green' : 'red';

                if (data.success && data.txid) {
                    const explorerUrl = `https://explorer.floofychain.com/tx/${data.txid}`;
                    msg.innerHTML = `${data.message} <br><a href="${explorerUrl}" target="_blank" rel="noopener noreferrer" style="color: #28a745; text-decoration: underline; font-weight: bold;">TXID: ${data.txid.substring(0, 12)}...</a>`;
                    loadBalance();
                } else {
                    msg.innerText = data.message;
                }
            } catch (e) {
                msg.style.color = 'red';
                msg.innerText = 'Connection error.';
            } finally {
                btn.disabled = false;
            }
        }
    </script>
    <script>
      function toggleDarkMode() {
        document.body.classList.toggle('dark-mode');
        const btn = document.getElementById('theme-toggle');
        if (document.body.classList.contains('dark-mode')) {
          btn.innerHTML = '☀️ Light';
          localStorage.setItem('theme', 'dark');
        } else {
          btn.innerHTML = '🌙 Dark';
          localStorage.setItem('theme', 'light');
        }
      }

      // Mantém a preferência guardada ao carregar a página
      if (localStorage.getItem('theme') === 'dark') {
        document.body.classList.add('dark-mode');
        const btn = document.getElementById('theme-toggle');
        if (btn) btn.innerHTML = '☀️ Light';
      }
    </script>
