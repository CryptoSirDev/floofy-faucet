<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Floofy Faucet</title>
  <style>
    body { font-family: sans-serif; max-width: 450px; margin: 50px auto; text-align: center; background: #fafafa; padding: 20px; }
    input { width: 90%; padding: 10px; margin-bottom: 12px; border: 1px solid #ccc; border-radius: 4px; }
    button { padding: 10px 20px; background: #28a745; color: white; border: none; border-radius: 4px; cursor: pointer; }
    button:hover { background: #218838; }
    #msg { margin-top: 15px; font-weight: bold; }
  </style>
</head>
<body>
  <h2>Floofy Faucet 🐾</h2>
  <p>Submit your address to receive 1 FLOOF (1 claim per IP / 24h).</p>
  <input type="text" id="address" placeholder="Enter FLOOF address">
  <br>
  <button onclick="submitClaim()">Request 1 FLOOF</button>
  <div id="msg"></div>

  <script>
    async function submitClaim() {
      const address = document.getElementById('address').value;
      const msg = document.getElementById('msg');
      msg.style.color = '#333';
      msg.innerText = 'Submitting...';

      try {
        const res = a => fetch('/api/claim', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ address })
        });
        const response = await res();
        const data = await response.json();
        msg.style.color = data.success ? 'green' : 'red';
        msg.innerText = data.message;
      } catch (e) {
        msg.style.color = 'red';
        msg.innerText = 'Connection error.';
      }
    }
  </script>
</body>
</html>
